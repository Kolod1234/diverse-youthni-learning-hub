<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
 <title id="title">Qualitative analysis observation reference</title><desc id="desc">Tables of flame-test colours, metal-ion precipitates and anion-test observations.</desc>
 <rect width="1500" height="980" rx="28" fill="#f8fafc"/>
 <g font-family="Arial,Helvetica,sans-serif" fill="#0f172a">
  <text x="750" y="55" text-anchor="middle" font-size="34" font-weight="700">Observations that identify ions</text>
  <g transform="translate(55,90)"><rect width="640" height="360" rx="20" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="320" y="42" text-anchor="middle" font-size="27" font-weight="700">flame tests</text>
   <g font-size="22"><text x="35" y="90" font-weight="700">ion</text><text x="210" y="90" font-weight="700">colour</text><text x="420" y="90" font-weight="700">observation swatch</text>
    <text x="35" y="137">Li<tspan baseline-shift="super" font-size="16">+</tspan></text><text x="210" y="137">crimson</text><rect x="430" y="112" width="150" height="32" rx="8" fill="#dc143c"/>
    <text x="35" y="187">Na<tspan baseline-shift="super" font-size="16">+</tspan></text><text x="210" y="187">yellow-orange</text><rect x="430" y="162" width="150" height="32" rx="8" fill="#f59e0b"/>
    <text x="35" y="237">K<tspan baseline-shift="super" font-size="16">+</tspan></text><text x="210" y="237">lilac</text><rect x="430" y="212" width="150" height="32" rx="8" fill="#c084fc"/>
    <text x="35" y="287">Ca<tspan baseline-shift="super" font-size="16">2+</tspan></text><text x="210" y="287">brick red</text><rect x="430" y="262" width="150" height="32" rx="8" fill="#b45309"/>
    <text x="35" y="337">Cu<tspan baseline-shift="super" font-size="16">2+</tspan></text><text x="210" y="337">blue-green</text><rect x="430" y="312" width="150" height="32" rx="8" fill="#0d9488"/>
   </g></g>
  <g transform="translate(735,90)"><rect width="710" height="530" rx="20" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="355" y="42" text-anchor="middle" font-size="27" font-weight="700">precipitates with NaOH(aq) and NH<tspan baseline-shift="sub" font-size="19">3</tspan>(aq)</text>
   <g font-size="20"><text x="25" y="88" font-weight="700">ion</text><text x="125" y="88" font-weight="700">precipitate</text><text x="340" y="88" font-weight="700">excess NaOH</text><text x="535" y="88" font-weight="700">excess NH<tspan baseline-shift="sub" font-size="14">3</tspan></text>
    <text x="25" y="137">Cu<tspan baseline-shift="super" font-size="14">2+</tspan></text><text x="125" y="137" fill="#2563eb">blue</text><text x="340" y="137">insoluble</text><text x="535" y="137" fill="#1d4ed8">deep-blue solution</text>
    <text x="25" y="187">Fe<tspan baseline-shift="super" font-size="14">2+</tspan></text><text x="125" y="187" fill="#15803d">green</text><text x="340" y="187">insoluble</text><text x="535" y="187">insoluble</text>
    <text x="25" y="237">Fe<tspan baseline-shift="super" font-size="14">3+</tspan></text><text x="125" y="237" fill="#92400e">brown</text><text x="340" y="237">insoluble</text><text x="535" y="237">insoluble</text>
    <text x="25" y="287">Al<tspan baseline-shift="super" font-size="14">3+</tspan></text><text x="125" y="287">white</text><text x="340" y="287">dissolves</text><text x="535" y="287">insoluble</text>
    <text x="25" y="337">Zn<tspan baseline-shift="super" font-size="14">2+</tspan></text><text x="125" y="337">white</text><text x="340" y="337">dissolves</text><text x="535" y="337">dissolves</text>
    <text x="25" y="387">Mg<tspan baseline-shift="super" font-size="14">2+</tspan></text><text x="125" y="387">white</text><text x="340" y="387">insoluble</text><text x="535" y="387">insoluble</text>
   </g><rect x="25" y="425" width="660" height="75" rx="14" fill="#eff6ff"/><text x="355" y="458" text-anchor="middle" font-size="20">â€œDissolvesâ€ means the precipitate disappears</text><text x="355" y="485" text-anchor="middle" font-size="20">to form a colourless solution unless stated otherwise.</text></g>
  <g transform="translate(55,660)"><rect width="1390" height="260" rx="20" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="695" y="42" text-anchor="middle" font-size="27" font-weight="700">anion tests</text>
   <g font-size="21"><text x="30" y="88" font-weight="700">ion</text><text x="210" y="88" font-weight="700">reagent and preparation</text><text x="820" y="88" font-weight="700">positive observation</text>
    <text x="30" y="133">Cl<tspan baseline-shift="super" font-size="15">âˆ’</tspan></text><text x="210" y="133">acidify, then add AgNO<tspan baseline-shift="sub" font-size="15">3</tspan>(aq)</text><text x="820" y="133">white AgCl precipitate</text>
    <text x="30" y="173">Br<tspan baseline-shift="super" font-size="15">âˆ’</tspan></text><text x="210" y="173">acidify, then add AgNO<tspan baseline-shift="sub" font-size="15">3</tspan>(aq)</text><text x="820" y="173">cream AgBr precipitate</text>
    <text x="30" y="213">I<tspan baseline-shift="super" font-size="15">âˆ’</tspan></text><text x="210" y="213">acidify, then add AgNO<tspan baseline-shift="sub" font-size="15">3</tspan>(aq)</text><text x="820" y="213">yellow AgI precipitate</text>
    <text x="30" y="253">SO<tspan baseline-shift="sub" font-size="15">4</tspan><tspan baseline-shift="super" font-size="15">2âˆ’</tspan></text><text x="210" y="253">acidify, then add BaCl<tspan baseline-shift="sub" font-size="15">2</tspan>(aq)</text><text x="820" y="253">white BaSO<tspan baseline-shift="sub" font-size="15">4</tspan> precipitate</text>
   </g></g>
 </g>
</svg>