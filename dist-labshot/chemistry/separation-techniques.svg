<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
 <title id="title">Standard laboratory separation techniques</title><desc id="desc">Five labelled panels show filtration, crystallisation, paper chromatography, simple distillation and fractional distillation.</desc>
 <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
 <rect width="1600" height="1050" rx="28" fill="#f8fafc"/>
 <g font-family="Arial,Helvetica,sans-serif" fill="#0f172a" stroke-linecap="round" stroke-linejoin="round">
  <text x="800" y="55" text-anchor="middle" font-size="34" font-weight="700">Choosing the apparatus for the mixture</text>
  <g transform="translate(45,95)"><rect width="480" height="400" rx="22" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="240" y="45" text-anchor="middle" font-size="27" font-weight="700">filtration</text>
   <path d="M170 90 L300 90 L260 220 L210 220 Z" fill="#fff" stroke="#334155" stroke-width="5"/><path d="M190 110 L280 110 L252 200 L218 200 Z" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/><path d="M235 220 V270" stroke="#334155" stroke-width="5"/>
   <path d="M175 355 Q240 385 305 355 L285 260 H195 Z" fill="#dbeafe" stroke="#334155" stroke-width="5"/><text x="360" y="135" font-size="21">residue</text><path d="M350 145 L270 145" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="350" y="305" font-size="21">filtrate</text><path d="M340 312 L285 325" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  </g>
  <g transform="translate(560,95)"><rect width="480" height="400" rx="22" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="240" y="45" text-anchor="middle" font-size="27" font-weight="700">crystallisation</text>
   <path d="M110 300 Q240 365 370 300 L345 210 H135 Z" fill="#bae6fd" stroke="#334155" stroke-width="5"/><path d="M135 210 H345" stroke="#0284c7" stroke-width="4"/><g fill="#2563eb"><path d="M190 275 l15 -18 15 18 -15 18z"/><path d="M250 300 l15 -18 15 18 -15 18z"/><path d="M300 260 l15 -18 15 18 -15 18z"/></g>
   <path d="M165 165 C150 130 180 115 165 80 M240 165 C225 130 255 115 240 80 M315 165 C300 130 330 115 315 80" fill="none" stroke="#94a3b8" stroke-width="5"/>
   <text x="240" y="385" text-anchor="middle" font-size="21">concentrate, cool, filter and dry</text>
  </g>
  <g transform="translate(1075,95)"><rect width="480" height="400" rx="22" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="240" y="45" text-anchor="middle" font-size="27" font-weight="700">paper chromatography</text>
   <rect x="105" y="85" width="270" height="260" rx="8" fill="#fefce8" stroke="#334155" stroke-width="4"/><path d="M125 305 H355" stroke="#475569" stroke-width="3" stroke-dasharray="9 7"/><text x="380" y="312" font-size="19">pencil baseline</text>
   <path d="M125 120 H355" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="8 6"/><text x="380" y="126" font-size="19">solvent front</text>
   <circle cx="180" cy="305" r="9" fill="#7c3aed"/><circle cx="180" cy="210" r="13" fill="#7c3aed"/><circle cx="250" cy="305" r="9" fill="#dc2626"/><circle cx="250" cy="165" r="13" fill="#dc2626"/><circle cx="320" cy="305" r="9" fill="#0f766e"/><circle cx="320" cy="245" r="13" fill="#0f766e"/>
  </g>
  <g transform="translate(170,540)"><rect width="590" height="455" rx="22" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="295" y="45" text-anchor="middle" font-size="27" font-weight="700">simple distillation</text>
   <circle cx="180" cy="260" r="90" fill="#dbeafe" stroke="#334155" stroke-width="5"/><path d="M180 170 V105 H330" fill="none" stroke="#334155" stroke-width="18"/><path d="M330 105 L480 250" stroke="#334155" stroke-width="28"/><path d="M330 105 L480 250" stroke="#f8fafc" stroke-width="16"/><path d="M350 126 L460 232" stroke="#334155" stroke-width="3"/><path d="M335 130 L375 90 M440 255 L480 215" stroke="#0284c7" stroke-width="5" marker-end="url(#arr)"/>
   <path d="M470 245 V335 H535 V245" fill="#dbeafe" stroke="#334155" stroke-width="5"/><text x="480" y="380" font-size="19">distillate</text><text x="330" y="80" font-size="19">thermometer bulb at side arm</text><text x="55" y="395" font-size="19">heat mixture</text>
  </g>
  <g transform="translate(840,540)"><rect width="590" height="455" rx="22" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="295" y="45" text-anchor="middle" font-size="27" font-weight="700">fractional distillation</text>
   <circle cx="150" cy="315" r="75" fill="#dbeafe" stroke="#334155" stroke-width="5"/><rect x="125" y="105" width="50" height="150" fill="#fff" stroke="#334155" stroke-width="5"/><g fill="#94a3b8"><circle cx="145" cy="130" r="8"/><circle cx="160" cy="155" r="8"/><circle cx="140" cy="180" r="8"/><circle cx="160" cy="205" r="8"/><circle cx="143" cy="230" r="8"/></g>
   <path d="M150 105 H310" stroke="#334155" stroke-width="18"/><path d="M310 105 L465 260" stroke="#334155" stroke-width="28"/><path d="M310 105 L465 260" stroke="#f8fafc" stroke-width="16"/><path d="M450 255 V345 H520 V255" fill="#dbeafe" stroke="#334155" stroke-width="5"/><text x="215" y="90" font-size="19">fractionating column</text><text x="35" y="420" font-size="19">different boiling points</text>
  </g>
 </g>
</svg>