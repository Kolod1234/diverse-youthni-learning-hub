<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
 <title id="title">Products of acid reactions</title><desc id="desc">Four clear reaction routes from an acid to metals, bases, carbonates or hydrogencarbonates, and ammonia.</desc>
 <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
 <rect width="1400" height="820" rx="28" fill="#f8fafc"/>
 <g font-family="Arial,Helvetica,sans-serif" fill="#0f172a">
  <rect x="505" y="320" width="390" height="170" rx="30" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="700" y="390" text-anchor="middle" font-size="38" font-weight="700">acid</text><text x="700" y="440" text-anchor="middle" font-size="25">source of H<tspan baseline-shift="super" font-size="18">+</tspan>(aq)</text>
  <g font-size="25" text-anchor="middle">
   <rect x="70" y="70" width="390" height="200" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="265" y="125" font-weight="700">reactive metal</text><text x="265" y="175">salt + hydrogen</text><text x="265" y="220" fill="#475569">H<tspan baseline-shift="sub" font-size="18">2</tspan>: lighted splint gives a pop</text>
   <rect x="940" y="70" width="390" height="200" rx="24" fill="#ecfdf5" stroke="#0f766e" stroke-width="4"/><text x="1135" y="125" font-weight="700">base or alkali</text><text x="1135" y="175">salt + water</text><text x="1135" y="220" fill="#475569">neutralisation</text>
   <rect x="70" y="550" width="450" height="200" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="295" y="605" font-weight="700">carbonate / hydrogencarbonate</text><text x="295" y="655">salt + water + carbon dioxide</text><text x="295" y="705" fill="#475569">CO<tspan baseline-shift="sub" font-size="18">2</tspan>: limewater turns milky</text>
   <rect x="880" y="550" width="450" height="200" rx="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="1105" y="605" font-weight="700">ammonia</text><text x="1105" y="655">ammonium salt</text><text x="1105" y="705" fill="#475569">no water shown in word equation</text>
  </g>
  <path d="M530 335 L430 270" stroke="#334155" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M870 335 L970 270" stroke="#334155" stroke-width="6" fill="none" marker-end="url(#arr)"/>
  <path d="M530 475 L475 550" stroke="#334155" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M870 475 L925 550" stroke="#334155" stroke-width="6" fill="none" marker-end="url(#arr)"/>
 </g>
</svg>