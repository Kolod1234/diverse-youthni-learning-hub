<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
 <title id="title">pH scale and indicator colours</title><desc id="desc">A pH scale from zero to fourteen with CCEA classifications and a separate indicator colour table.</desc>
 <rect width="1400" height="720" rx="28" fill="#f8fafc"/>
 <g font-family="Arial,Helvetica,sans-serif" fill="#0f172a">
  <text x="700" y="62" text-anchor="middle" font-size="36" font-weight="700">pH scale</text>
  <g transform="translate(70,110)">
   <rect x="0" y="0" width="84" height="90" fill="#7f1d1d"/><rect x="84" y="0" width="84" height="90" fill="#b91c1c"/><rect x="168" y="0" width="84" height="90" fill="#ef4444"/>
   <rect x="252" y="0" width="84" height="90" fill="#f97316"/><rect x="336" y="0" width="84" height="90" fill="#fb923c"/><rect x="420" y="0" width="84" height="90" fill="#facc15"/><rect x="504" y="0" width="84" height="90" fill="#fde047"/>
   <rect x="588" y="0" width="84" height="90" fill="#22c55e"/>
   <rect x="672" y="0" width="84" height="90" fill="#14b8a6"/><rect x="756" y="0" width="84" height="90" fill="#06b6d4"/><rect x="840" y="0" width="84" height="90" fill="#0ea5e9"/><rect x="924" y="0" width="84" height="90" fill="#3b82f6"/>
   <rect x="1008" y="0" width="84" height="90" fill="#4f46e5"/><rect x="1092" y="0" width="84" height="90" fill="#6d28d9"/><rect x="1176" y="0" width="84" height="90" fill="#581c87"/>
   <g font-size="26" font-weight="700" text-anchor="middle" fill="white">
    <text x="42" y="56">0</text><text x="126" y="56">1</text><text x="210" y="56">2</text><text x="294" y="56">3</text><text x="378" y="56">4</text><text x="462" y="56">5</text><text x="546" y="56" fill="#0f172a">6</text><text x="630" y="56">7</text><text x="714" y="56">8</text><text x="798" y="56">9</text><text x="882" y="56">10</text><text x="966" y="56">11</text><text x="1050" y="56">12</text><text x="1134" y="56">13</text><text x="1218" y="56">14</text>
   </g>
   <path d="M0 230 H252 M252 230 H588 M588 230 H672 M672 230 H1008 M1008 230 H1260" stroke="#334155" stroke-width="5"/>
   <g font-size="24" text-anchor="middle"><text x="126" y="278">strong acid</text><text x="420" y="278">weak acid</text><text x="630" y="278">neutral</text><text x="840" y="278">weak alkali</text><text x="1134" y="278">strong alkali</text></g>
  </g>
  <g transform="translate(105,440)">
   <rect x="0" y="0" width="1190" height="210" rx="20" fill="white" stroke="#cbd5e1" stroke-width="3"/>
   <text x="30" y="50" font-size="26" font-weight="700">Indicator</text><text x="345" y="50" font-size="26" font-weight="700">acid</text><text x="680" y="50" font-size="26" font-weight="700">neutral</text><text x="1010" y="50" font-size="26" font-weight="700">alkaline</text>
   <path d="M0 72 H1190 M275 0 V210" stroke="#cbd5e1" stroke-width="2"/>
   <g font-size="23"><text x="30" y="112">litmus</text><text x="30" y="157">methyl orange</text><text x="30" y="202">phenolphthalein</text>
    <text x="345" y="112" fill="#dc2626">red</text><text x="680" y="112" fill="#7c3aed">purple</text><text x="1010" y="112" fill="#2563eb">blue</text>
    <text x="345" y="157" fill="#dc2626">red</text><text x="680" y="157" fill="#f97316">orange</text><text x="1010" y="157" fill="#eab308">yellow</text>
    <text x="345" y="202">colourless</text><text x="680" y="202">colourless</text><text x="1010" y="202" fill="#db2777">pink</text>
   </g>
  </g>
 </g>
</svg>