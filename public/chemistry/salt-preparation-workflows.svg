<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
 <title id="title">Two routes for preparing a soluble salt</title><desc id="desc">A two-row flowchart compares excess insoluble solid with acid against titration of acid with alkali.</desc>
 <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
 <rect width="1500" height="900" rx="28" fill="#f8fafc"/>
 <g font-family="Arial,Helvetica,sans-serif" fill="#0f172a">
  <text x="750" y="60" text-anchor="middle" font-size="35" font-weight="700">Choosing and carrying out the preparation</text>
  <text x="65" y="135" font-size="28" font-weight="700" fill="#0f766e">Insoluble solid + acid</text>
  <g transform="translate(65,170)" font-size="21" text-anchor="middle">
   <rect width="240" height="170" rx="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="4"/><text x="120" y="55" font-weight="700">warm acid</text><text x="120" y="95">add solid in</text><text x="120" y="128">small portions</text>
   <path d="M255 85 H305" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="320" width="240" height="170" rx="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="4"/><text x="440" y="55" font-weight="700">excess remains</text><text x="440" y="95">no more solid</text><text x="440" y="128">reacts</text>
   <path d="M575 85 H625" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="640" width="240" height="170" rx="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="4"/><text x="760" y="55" font-weight="700">filter</text><text x="760" y="95">residue: excess</text><text x="760" y="128">filtrate: salt solution</text>
   <path d="M895 85 H945" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="960" width="240" height="170" rx="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="4"/><text x="1080" y="55" font-weight="700">concentrate</text><text x="1080" y="95">evaporate about</text><text x="1080" y="128">half the water</text>
   <path d="M1215 85 H1265" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="1280" width="140" height="170" rx="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="4"/><text x="1350" y="52" font-weight="700">cool</text><text x="1350" y="88">filter</text><text x="1350" y="122">dry</text>
  </g>
  <text x="65" y="485" font-size="28" font-weight="700" fill="#7c3aed">Acid + alkali</text>
  <g transform="translate(65,520)" font-size="21" text-anchor="middle">
   <rect width="240" height="170" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="120" y="55" font-weight="700">pipette alkali</text><text x="120" y="95">into a flask</text><text x="120" y="128">add indicator</text>
   <path d="M255 85 H305" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="320" width="240" height="170" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="440" y="55" font-weight="700">titrate</text><text x="440" y="95">record acid volume</text><text x="440" y="128">at end point</text>
   <path d="M575 85 H625" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="640" width="240" height="170" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="760" y="48" font-weight="700">repeat exactly</text><text x="760" y="88">without indicator</text><text x="760" y="128">pure salt solution</text>
   <path d="M895 85 H945" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="960" width="240" height="170" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="1080" y="55" font-weight="700">concentrate</text><text x="1080" y="95">evaporate about</text><text x="1080" y="128">half the water</text>
   <path d="M1215 85 H1265" stroke="#334155" stroke-width="6" marker-end="url(#arr)"/>
   <rect x="1280" width="140" height="170" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><text x="1350" y="52" font-weight="700">cool</text><text x="1350" y="88">filter</text><text x="1350" y="122">dry</text>
  </g>
  <rect x="275" y="775" width="950" height="75" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text x="750" y="822" text-anchor="middle" font-size="23">Use titration for sodium, potassium and ammonium salts because their compounds are soluble.</text>
 </g>
</svg>